# CI/CD for the Insights server and web client.
#
#   pull request  ->  check, test, build images (not pushed)
#   push to main  ->  ...then push images to GHCR, deploy to staging,
#                     then production after manual approval
#
# Deploy jobs are stubs: they show what would run against real infra.
# Production approval: Settings -> Environments -> production ->
# Required reviewers.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a deploy from main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DENO_VERSION: 2.4.2 # keep in step with mise.toml and the Dockerfiles

jobs:
  check:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - name: Install (fails if deno.lock is out of date)
        run: deno install --frozen
      - run: deno fmt --check
      - run: deno lint
      - run: deno check .

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server
            run: deno test --allow-all server
          - package: client
            run: deno task test:client
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno install --frozen
      - run: ${{ matrix.run }}

  build:
    name: Build ${{ matrix.image }} image
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            dockerfile: Dockerfile
          - image: web
            dockerfile: client/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          # sha-<7 chars> is the immutable tag that deploys reference.
          tags: |
            type=sha
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      # Both Dockerfiles cross-compile in the build stage, so arm64 needs
      # no QEMU emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy-staging:
    name: Deploy to staging (stub)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy
        env:
          TAG: sha-${{ github.sha }}
        run: |
          TAG="${TAG:0:11}"
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "### Staging deploy (stub)"
            echo "Would deploy, in order:"
            echo "1. \`$REGISTRY/server:$TAG\` (single replica: SQLite on a persistent volume)"
            echo "2. \`$REGISTRY/web:$TAG\`"
            echo "3. Wait for the rollout, then smoke test:"
            echo "   \`curl -fsS https://staging.suittracker.example/api/_ready\`"
            echo "4. On failure: roll back to the previous \`sha-*\` tag"
          } >> "$GITHUB_STEP_SUMMARY"
          # Real step would be e.g.:
          #   kubectl set image deployment/server server=$REGISTRY/server:$TAG
          #   kubectl rollout status deployment/server --timeout=2m

  deploy-production:
    name: Deploy to production (stub)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        env:
          TAG: sha-${{ github.sha }}
        run: |
          TAG="${TAG:0:11}"
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "### Production deploy (stub)"
            echo "Would promote the same images that passed staging:"
            echo "- \`$REGISTRY/server:$TAG\`"
            echo "- \`$REGISTRY/web:$TAG\`"
            echo "Then smoke test \`https://suittracker.example/api/_ready\`."
          } >> "$GITHUB_STEP_SUMMARY"
